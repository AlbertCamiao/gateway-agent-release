[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-agent"
version = "0.1.0"
description = "Feishu bot gateway for routing work to Codex and DSH sessions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "lark-oapi==1.7.5",
    "python-dotenv==1.2.4",
    "dbos==3.5.0",
    "textual>=0.80",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gateway-agent = "feishu_gateway.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"feishu_gateway" = ["py.typed", "skills/*/*.md", "templates/*.example"]
"feishu_gateway.bridge" = ["assets/*.mjs", "assets/*.json", "assets/*.md"]
